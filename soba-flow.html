<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SOBA — flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbit&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script defer src="sketch.js"></script>
  </head>
  <body>
    <div class="panel-stack">
      <div id="panel" class="panel">
        <button type="button" class="panel-header" id="panel-toggle" aria-expanded="true">
          <span class="panel-dot" aria-hidden="true"></span>
          <span class="panel-filename">soba-field.js</span>
          <span class="panel-caret" aria-hidden="true"></span>
        </button>
        <div class="panel-body" id="panel-body">
          <pre class="panel-stats" id="panel-stats"></pre>
        </div>
      </div>
      <button type="button" class="cloud-btn" id="cloud-mode" aria-pressed="false">
        <span class="cloud-label">CLOUD MODE</span>
        <span class="cloud-switch" aria-hidden="true"></span>
      </button>
    </div>
  </body>
</html>
